
<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Artwork 'Talk to Nakaminato Station'</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  </head>
  <body>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.4.2/lib/p5.js"></script>  
    
    <div class="card" style="width: 100%"> 
        <div class="card-body">  
            <div class="card">
                <div class="card-header">
                    <div class="overflow-y-scroll" id="question">
                    </div>
                </div>
                <div class="card-body" > 
                    <div class="overflow-y-scroll" id="answer">
                        ＊
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="card" style="width: 100%"> 
        <div class="card-body">  
            <form id='form'>
                <input type="text" class="form-control" id="textInput" placeholder="Input your question or comment to the station here in English.">
                <div class="d-grid gap-2">
                <button id="send" type="submit" class="btn btn-secondary">Send</button>
                </div>  
            </form>
        </div>
    </div>
    <div style="width: 100%" id="P5Canvas"> </div>

    <script type="module">
        // Import the functions you need from the SDKs you need
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-analytics.js";
        import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-functions.js";
        // TODO: Add SDKs for Firebase products that you want to use
        // https://firebase.google.com/docs/web/setup#available-libraries
        // Your web app's Firebase configuration
        // For Firebase JS SDK v7.20.0 and later, measurementId is optional
        const firebaseConfig = {
            apiKey: "--",
            authDomain: "--",
            databaseURL: "--",
            projectId: "--",
            storageBucket: "--",
            messagingSenderId: "7--",
            appId: "--",
            measurementId: "--"
        };

        // Initialize Firebase
        //const initialText = "こんにちは、私は那珂湊駅の作品です。お話しましょう。どんなことでも、できるだけこの駅や街のこととして捉えて、シンプルな色で表現します。同時に那珂湊駅の駅舎にある私（作品）の色も変化しています。ときどき適当なことを言ってしまいますがご容赦ください。では始めましょう。下の枠のなかにあなたの言葉を書いて、送ってください。"
        const initialText = "Hello, this is Nakaminato Station and its artwork. Let us talk. I will respond to your question or comment from my point of view as the station with simple colors. Good thing is the color of myself: platform of Nakaminato station's main lighting changes its color accordingly. Forgive me in case I say irresponsive words. Let us start! Put your works in the form box under this text and send it to me!"
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);

        const functions = getFunctions(app);
        //const getThread = httpsCallable(functions, 'thread');
        //const addMessage = httpsCallable(functions, 'assistants');
        const addMessage = httpsCallable(functions, 'chatCompletion');

        // UI Event
        const questionDiv = document.getElementById("question");
        const answerDiv = document.getElementById("answer");
        //const input = document.getElementById("input");
        const form = document.getElementById("form");
        form.addEventListener("submit",submitted);

        answerDiv.innerHTML =initialText;

        //P5
        let canvasParent= document.getElementById('P5Canvas');

        var state= 'init'
        var colors = [{name:'white',r:255,g:255,b:255}];
        let framesPerMmnute = 20*60;
        var framesPerBreath =0;
        var counter = 0;
        var counterRatio=0.0;

        //
        var data = {
            "question":"",
            "answer":initialText,
            "colors":[
                {"name":"白","r":255,"g":255,"b":255}
            ],
            "breath":10,
            "pleasure":0,
            "sad":0
        }

        function count(){
            framesPerBreath = framesPerMmnute /data.breath;

            counter = counter +1;
            if(counter>framesPerBreath ){
                counter = 0;
            }
            var ratio = counter/framesPerBreath ;
            angleMode(DEGREES);
            var angle = 360*ratio;
            var temp = sin(angle);
            counterRatio = (temp+1)/2;

        }

        window.setup = function(){
            console.log("setup")
            frameRate(20);
            createCanvas(windowWidth, windowHeight/100*50,WEBGL);
            //canvas.parent(canvasParent);  //canvasを指定した要素の子要素にする
            //canvasParent.style.height='20%';
        }

        window.draw = function(){
            count();
            //console.log("setup")
            background(230);
            orbitControl();
            //camera(0,-10,0,0,0,0);

            //ambientLight(255,255,255);

            let l = data.colors.length;

            //pointLight(100,100,100,0,0,0);
            //specularMaterial(255,255,255);

            noStroke();
            ambientLight(100);

            if(l==1){
                var d = 200*counterRatio;
                let color = data.colors[0];
                pLight(color,0,0,d);
            }

            if(l==2){
                var d = 100*counterRatio;
                let colorZero = data.colors[0];
                let colorOne = data.colors[1];

                pLight(colorZero,-150,0,d);
                pLight(colorOne,150,0,d);
            }

            if(l==3){
                var d = 50*counterRatio;
                let colorZero = data.colors[0];
                let colorOne = data.colors[1];  
                let colorTwo = data.colors[2];  
                pLight(colorZero,-200,0,d);
                pLight(colorOne,0,0,d);
                pLight(colorTwo,200,0,d);
            }

            ambientMaterial(200);
            plane(600);
        }

        function pLight(color,x,y,z){
            pointLight(color.r, color.g, color.b,x,y,z);
        }
            
        function submitted(e){
            e.preventDefault();
            

            var text = textInput.value;
            if(text == ''){
                return
            }
            console.log("Submitted!"+text);
            questionDiv.innerHTML = text;
            //answerDiv.innerHTML = "「"+text+"」について、今考えています。ちょっと、たぶん１０秒くらい、待ってね。";
            answerDiv.innerHTML = "Hi, now I am thinking about your comment: <b>"+text+"</b>  Wait a bit.";
            addMessage({ text: text,language:"en",thread:"none"})
                    .then((result) => {
                        console.log("incoming data:"+JSON.stringify(result));

                        data = result.data;

                        questionDiv.innerHTML = result.data.question;

                        var  answerText = "";
                        if(data==null){
                            //answerText = "ごめんね。今ちょっとAIが忙しいみたい。もう少しあとでお話ししましょう";
                            answerText = "Sorry, now the AI is a bit busy. Let us talk shortly after.";
                        }else{
                            answerText = result.data.answer;
                        }
                        
                        console.log(answerText);
                        answerDiv.innerHTML = answerText;
                        textInput.value='';
                    }).catch((e) => {
                        console.log( e );
                    });
        }
    </script>
  </body>
</html>
